name: Simulation publication nationale des services
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rechercher les donnees OSM
        run: python scripts/proposer-enrichissement-national.py
      - name: Preparer les modifications sans publier
        run: python scripts/valider-propositions-nationales.py
      - name: Verifier les differences entre original et proposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("validation-nationale").glob("aires*.json"))
          count=0
          for file in files:
              old=json.loads(Path(file.name).read_text(encoding="utf-8"))
              new=json.loads(file.read_text(encoding="utf-8"))
              assert len(old)==len(new),file.name
              for i,(a,b) in enumerate(zip(old,new)):
                  changed={k for k in set(a)|set(b) if a.get(k)!=b.get(k)}
                  if changed:
                      assert changed <= {"services","servicesSource","importReview"},(file.name,i,changed)
                      assert not a.get("services") and b.get("services"),(file.name,i)
                      assert b.get("servicesSource")==a.get("source"),(file.name,i)
                      count+=1
          print("SIMULATION_FICHIERS",len(files))
          print("SIMULATION_FICHES",count)
          print("AUCUN_FICHIER_SOURCE_MODIFIE")
          PY
      - name: Telecharger les propositions
        uses: actions/upload-artifact@v4
        with:
          name: simulation-publication-nationale
          path: |
            rapports-enrichissement/
            validation-nationale/
          retention-days: 30
