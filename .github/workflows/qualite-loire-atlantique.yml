name: Controle automatique Loire-Atlantique
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * 1'
  push:
    paths:
      - 'aires-loire-atlantique.json'
      - 'aires-pdl.json'
      - '.github/workflows/qualite-loire-atlantique.yml'
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier les fiches sans les modifier
        shell: bash
        run: |
          python - <<'PY'
          import json, math, unicodedata, re, os
          from pathlib import Path

          osm=json.loads(Path("aires-loire-atlantique.json").read_text(encoding="utf-8"))
          regional=[x for x in json.loads(Path("aires-pdl.json").read_text(encoding="utf-8")) if str(x.get("department"))=="44"]
          def norm(s):
              s=unicodedata.normalize("NFD",str(s or "").lower())
              return re.sub(r"[^a-z0-9]","", "".join(c for c in s if unicodedata.category(c)!="Mn"))
          def coords(x):
              try:
                  lat,lon=float(x["latitude"]),float(x["longitude"])
                  return (lat,lon) if math.isfinite(lat) and math.isfinite(lon) and -90<=lat<=90 and -180<=lon<=180 else None
              except (ValueError,TypeError,KeyError): return None
          def distance(a,b):
              # Haversine distance in metres
              lat1,lon1=map(math.radians,a);lat2,lon2=map(math.radians,b)
              dlat=lat2-lat1;dlon=lon2-lon1
              h=math.sin(dlat/2)**2+math.cos(lat1)*math.cos(lat2)*math.sin(dlon/2)**2
              return 6371000*2*math.asin(min(1,math.sqrt(h)))

          # Même règle de visibilité que l'application du 44 (octobre 2026).
          regional_ids={str(x.get("sourceId","")) for x in regional}
          visible_regional=[x for x in regional if not (x.get("duplicateOfSourceId") and str(x["duplicateOfSourceId"]) in regional_ids)]
          aliases={
              "way/824236451":"ACCAMEDREFFEAC",
              "way/909580170":"ACCAMPDL044V50028L",
              "way/909637849":"ACCAMEAIREDECAMPINGCARPONTCHATEAU",
              "way/411102226":"ACCAMPDL044V50420T",
              "way/1232804505":"ACCAMEAIRECAMPINGCARWELCOMFROSSAY"
          }
          def visible_extra(a):
              key=str(a.get("sourceId",""))
              if a.get("duplicateOfSourceId") and str(a["duplicateOfSourceId"]) in regional_ids: return False
              if key in aliases and aliases[key] in regional_ids: return False
              point=coords(a)
              if point:
                  for b in regional:
                      other=coords(b)
                      if other and abs(point[0]-other[0])<0.0003 and abs(point[1]-other[1])<0.0003: return False
                      if other and abs(point[0]-other[0])<0.001 and abs(point[1]-other[1])<0.001 and norm(a.get("name"))==norm(b.get("name")): return False
              return True
          visible_osm=[x for x in osm if visible_extra(x)]
          # Prix de nuitée sans objet : ces espaces de pique-nique ne sont pas des haltes
          # nocturnes vérifiées, ils ne doivent pas gonfler le compteur des tarifs manquants.
          excluded_picnic=[x for x in visible_regional if x.get("priceStatus")=="not_applicable_for_night_stay"]
          assert all(x.get("overnightStatus")=="not_established" and "pique-nique" in str(x.get("type","")).lower() for x in excluded_picnic), "Classement pique-nique incohérent"
          regional_unknown=sum(x.get("price")=="Non confirmé" for x in regional)
          visible_regional_unknown=sum(x.get("price")=="Non confirmé" for x in visible_regional)
          osm_unknown=sum(x.get("price")=="Non confirmé" for x in osm)
          visible_osm_unknown=sum(x.get("price")=="Non confirmé" for x in visible_osm)
          overnight_pending=sum(x.get("overnightStatus")=="not_established" and "pique-nique" in str(x.get("type","")).lower() for x in visible_regional)
          total_visible=len(visible_regional)+len(visible_osm)
          unresolved_with_contact=[x for x in visible_regional if x.get("price")=="Non confirmé" and x.get("contactPhone")]
          unresolved_osm_with_contact=[x for x in visible_osm if x.get("price")=="Non confirmé" and x.get("contactPhone")]
          contacts_incomplete=[str(x.get("sourceId")) for x in visible_regional+visible_osm if x.get("contactPhone") and (not str(x.get("contactSource","")).startswith("https://") or not x.get("contactRole") and x.get("priceCheckedAt"))]
          assert not contacts_incomplete, "Contact sourcé incomplet : "+str(contacts_incomplete)
          phones_invalid=[x.get("sourceId") for x in visible_regional+visible_osm if x.get("contactPhone") and not re.fullmatch(r"[+0-9 ().-]{10,25}",str(x.get("contactPhone")))]
          assert not phones_invalid, "Contacts téléphoniques invalides : "+str(phones_invalid)
          extra_potential_duplicates=[x for x in visible_osm if x.get("potentialDuplicateOfSourceId")]
          overnight_other_regional=sum(x.get("overnightStatus")=="not_established" and "pique-nique" not in str(x.get("type","")).lower() for x in visible_regional)
          overnight_extra=sum(x.get("overnightStatus")=="not_established" for x in visible_osm)
          missing_city=missing_services=unknown_price=bad_gps=0
          candidates=[]
          for x in osm:
              name=x.get("name","")
              if not x.get("city") or "confirmer" in str(x.get("city")).lower(): missing_city+=1
              if not x.get("services"): missing_services+=1
              if not x.get("price") or "confirm" in str(x.get("price")).lower(): unknown_price+=1
              a=coords(x)
              if a is None:
                  bad_gps+=1
                  continue
              near=[]
              for y in regional:
                  b=coords(y)
                  if b is None: continue
                  d=distance(a,b)
                  if d<=350:
                      near.append((round(d),y))
              near.sort(key=lambda t:t[0])
              if near:
                  best=near[0]
                  confidence="nom_identique" if norm(name)==norm(best[1].get("name")) else ("proche_30m" if best[0]<=30 else "a_verifier")
                  candidates.append((name,x.get("sourceId",""),best[1].get("name",""),best[1].get("sourceId",""),best[0],len(near),confidence))
          lines=[
              "# Contrôle automatique des aires — Loire-Atlantique (44)",
              "",
              "Ce rapport est indicatif : la proximité ne prouve pas un doublon. Aucune donnée n'est modifiée.",
              "",
              f"- Fiches OSM : **{len(osm)}**",
              f"- Fiches régionales : **{len(regional)}**",
              f"- Communes à vérifier : **{missing_city}**",
              f"- Services absents des fiches OSM : **{missing_services}**",
              f"- Compléments OSM bruts dont le prix est absent, partiel ou contient 'confirm' : **{unknown_price}** (ne couvre pas les fiches régionales)",
              f"- Fiches régionales brutes dont le prix vaut exactement 'Non confirmé' : **{regional_unknown}**",
              f"- Fiches régionales visibles au prix exactement 'Non confirmé' : **{visible_regional_unknown}**",
              f"- Simples aires de pique-nique au tarif de nuitée non applicable, sans nuitée validée : **{len(excluded_picnic)}**",
              "- La baisse du nombre de prix inconnus provient d'une **requalification**, pas d'une confirmation de tarif.",
              f"- Parmi celles-ci, fiches disposant d'un contact public sourcé (camping, ferme ou mairie) : **{len(unresolved_with_contact)}**",
              f"- Compléments visibles au prix non confirmé avec un contact public sourcé : **{len(unresolved_osm_with_contact)}**",
              f"- **Total fiches visibles au prix strictement Non confirmé avec un contact : {len(unresolved_with_contact)+len(unresolved_osm_with_contact)} / {visible_regional_unknown+visible_osm_unknown}**",
              "- Aucun contact n'a été appelé : un téléphone sourcé ne remplace pas une confirmation de tarif.",
              f"- Fiches complémentaires brutes au prix exactement 'Non confirmé' : **{osm_unknown}**",
              f"- Fiches complémentaires visibles au prix exactement 'Non confirmé' : **{visible_osm_unknown}**",
              f"- **Total des tarifs strictement non confirmés parmi les fiches visibles : {visible_regional_unknown+visible_osm_unknown}**",
              f"- Fiches régionales masquées par doublon déclaré : **{len(regional)-len(visible_regional)}**",
              f"- Compléments OSM masqués par le filtre transversal : **{len(osm)-len(visible_osm)}**",
              f"- **Total de fiches visibles attendu (mêmes filtres que app.js) : {total_visible}** ({len(visible_regional)} régionales + {len(visible_osm)} complémentaires)",
              f"- Écart avec le dernier compteur utilisateur confirmé (165) : **{total_visible-165:+d}** ; tout changement volontaire devra être revalidé",
              f"- Aires de pique-nique régionales avec nuitée non établie : **{overnight_pending}**",
              f"- Autres haltes régionales avec nuitée non établie : **{overnight_other_regional}**",
              f"- Compléments visibles avec nuitée non établie : **{overnight_extra}**",
              f"- Compléments visibles explicitement marqués doublons possibles : **{len(extra_potential_duplicates)}**",
              "- Ces doublons potentiels ne sont pas fusionnés sans concordance suffisante des emprises.",
              f"- Coordonnées GPS invalides : **{bad_gps}**",
              f"- Fiches OSM avec une correspondance régionale à 350 m ou moins : **{len(candidates)}**",
              "",
              "| Fiche OSM | Fiche régionale la plus proche | Distance | Autres fiches dans 350 m | Indice |",
              "|---|---|---:|---:|---|"
          ]
          for name,oid,rname,rid,metres,n,confidence in candidates:
              clean=lambda s:str(s).replace("|","/").replace("\n"," ")
              lines.append(f"| {clean(name)} (`{oid}`) | {clean(rname)} (`{rid}`) | {metres} m | {n-1} | {confidence} |")
          report="\n".join(lines)+"\n"
          print(report)
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary: Path(summary).write_text(report,encoding="utf-8")
          PY
