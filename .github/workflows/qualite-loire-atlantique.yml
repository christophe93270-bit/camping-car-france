name: Controle automatique Loire-Atlantique
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * 1'
  push:
    paths:
      - 'aires-loire-atlantique.json'
      - 'aires-pdl.json'
      - '.github/workflows/qualite-loire-atlantique.yml'
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier les fiches sans les modifier
        shell: bash
        run: |
          python - <<'PY'
          import json, math, unicodedata, re, os
          from pathlib import Path

          osm=json.loads(Path("aires-loire-atlantique.json").read_text(encoding="utf-8"))
          regional=[x for x in json.loads(Path("aires-pdl.json").read_text(encoding="utf-8")) if str(x.get("department"))=="44"]
          def norm(s):
              s=unicodedata.normalize("NFD",str(s or "").lower())
              return re.sub(r"[^a-z0-9]","", "".join(c for c in s if unicodedata.category(c)!="Mn"))
          def coords(x):
              try:
                  lat,lon=float(x["latitude"]),float(x["longitude"])
                  return (lat,lon) if math.isfinite(lat) and math.isfinite(lon) and -90<=lat<=90 and -180<=lon<=180 else None
              except (ValueError,TypeError,KeyError): return None
          def distance(a,b):
              # Haversine distance in metres
              lat1,lon1=map(math.radians,a);lat2,lon2=map(math.radians,b)
              dlat=lat2-lat1;dlon=lon2-lon1
              h=math.sin(dlat/2)**2+math.cos(lat1)*math.cos(lat2)*math.sin(dlon/2)**2
              return 6371000*2*math.asin(min(1,math.sqrt(h)))

          # Même règle de visibilité que l'application du 44 (octobre 2026).
          regional_ids={str(x.get("sourceId","")) for x in regional}
          visible_regional=[x for x in regional if not (x.get("duplicateOfSourceId") and str(x["duplicateOfSourceId"]) in regional_ids)]
          aliases={
              "way/824236451":"ACCAMEDREFFEAC",
              "way/909580170":"ACCAMPDL044V50028L",
              "way/909637849":"ACCAMEAIREDECAMPINGCARPONTCHATEAU",
              "way/411102226":"ACCAMPDL044V50420T",
              "way/1232804505":"ACCAMEAIRECAMPINGCARWELCOMFROSSAY"
          }
          def visible_extra(a):
              key=str(a.get("sourceId",""))
              if a.get("duplicateOfSourceId") and str(a["duplicateOfSourceId"]) in regional_ids: return False
              if key in aliases and aliases[key] in regional_ids: return False
              point=coords(a)
              if point:
                  for b in regional:
                      other=coords(b)
                      if other and abs(point[0]-other[0])<0.0003 and abs(point[1]-other[1])<0.0003: return False
                      if other and abs(point[0]-other[0])<0.001 and abs(point[1]-other[1])<0.001 and norm(a.get("name"))==norm(b.get("name")): return False
              return True
          visible_osm=[x for x in osm if visible_extra(x)]
          # Prix de nuitée sans objet : ces espaces de pique-nique ne sont pas des haltes
          # nocturnes vérifiées, ils ne doivent pas gonfler le compteur des tarifs manquants.
          excluded_picnic=[x for x in visible_regional if x.get("priceStatus")=="not_applicable_for_night_stay"]
          assert all(x.get("overnightStatus")=="not_established" and "pique-nique" in str(x.get("type","")).lower() for x in excluded_picnic), "Classement pique-nique incohérent"
          regional_unknown=sum(x.get("price")=="Non confirmé" for x in regional)
          visible_regional_unknown=sum(x.get("price")=="Non confirmé" for x in visible_regional)
          osm_unknown=sum(x.get("price")=="Non confirmé" for x in osm)
          visible_osm_unknown=sum(x.get("price")=="Non confirmé" for x in visible_osm)
          overnight_pending=sum(x.get("overnightStatus")=="not_established" and "pique-nique" in str(x.get("type","")).lower() for x in visible_regional)
          total_visible=len(visible_regional)+len(visible_osm)
          unresolved_with_contact=[x for x in visible_regional if x.get("price")=="Non confirmé" and x.get("contactPhone")]
          unresolved_osm_with_contact=[x for x in visible_osm if x.get("price")=="Non confirmé" and x.get("contactPhone")]
          emails=[x for x in visible_regional+visible_osm if x.get("contactEmail")]
          invalid_emails=[str(x.get("sourceId")) for x in emails if not re.fullmatch(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}",str(x.get("contactEmail",""))) or not str(x.get("contactEmailSource","")).startswith("https://")]
          assert not invalid_emails, "44 : courriel ou preuve invalide : "+str(invalid_emails)
          expected_email_ids={"ACCAMPDL044V51I23X","ACCAMACCAMPDL044V50G1TE","ACCAMPDL044V5002ZN","ACCAMACCAMPDL044000049","ACCAMPDL044V50ZDO9","ACCAMEAIREDESTMOLF","node/11786823109","way/1317028497","ACCAMPDL044V50Y077","ACCAMACCAMPDL044000155","ACCAMACCAMPDL044000154"}
          assert expected_email_ids.issubset({str(x.get("sourceId")) for x in emails}), "44 : les 11 tarifs non confirmés doivent disposer d’un courriel public sourcé"
          unresolved_all=[x for x in visible_regional+visible_osm if x.get("price")=="Non confirmé"]
          assert len(unresolved_all)==11 and all(x.get("contactEmail") and x.get("contactEmailSource") for x in unresolved_all), "44 : suivi des 11 prix non confirmés ou des courriels incomplet"
          ranch=next(x for x in visible_regional if x.get("sourceId")=="ACCAMACCAMPDL044000049")
          assert ranch.get("price")=="Non confirmé" and "point de vidange camping-car" in " ".join(ranch.get("services",[])).lower() and ranch.get("drainageFacilitySource")=="https://www.yellohvillage.fr/camping/le_ranch/nos_services", "Le Ranch : service vérifié ou réserve manquante"
          contacts_incomplete=[str(x.get("sourceId")) for x in visible_regional+visible_osm if x.get("contactPhone") and (not str(x.get("contactSource","")).startswith("https://") or not x.get("contactRole") and x.get("priceCheckedAt"))]
          assert not contacts_incomplete, "Contact sourcé incomplet : "+str(contacts_incomplete)
          phones_invalid=[x.get("sourceId") for x in visible_regional+visible_osm if x.get("contactPhone") and not re.fullmatch(r"[+0-9 ().-]{10,25}",str(x.get("contactPhone")))]
          assert not phones_invalid, "Contacts téléphoniques invalides : "+str(phones_invalid)
          extra_potential_duplicates=[x for x in visible_osm if x.get("potentialDuplicateOfSourceId")]
          combined_visible=visible_regional+visible_osm
          combined_ids={str(x.get("sourceId","")) for x in combined_visible}
          linked_zones=[x for x in combined_visible if x.get("sharedSiteWithSourceId")]
          unresolved_shared=[str(x.get("sourceId")) for x in linked_zones if str(x["sharedSiteWithSourceId"]) not in combined_ids]
          assert not unresolved_shared, "Zones partagées sans fiche associée visible : "+str(unresolved_shared)
          conditional_access_ids={"ACCAMPDL044V50Y077","ACCAMPDL044V50ZDO9","ACCAMACCAMEELMANAS"}
          conditional_access=[x for x in visible_regional if str(x.get("sourceId")) in conditional_access_ids]
          assert len(conditional_access)==3 and all(x.get("accessNote") and str(x.get("accessSource","")).startswith("https://") for x in conditional_access), "44 : réserves d'accès ferme/ANAS absentes"
          france_passion=[x for x in conditional_access if x.get("sourceId")!="ACCAMACCAMEELMANAS"]
          assert len(france_passion)==2 and all(x.get("price")=="Non confirmé" for x in france_passion), "France Passion : adhésion 2026 des hôtes encore non confirmée"
          anas=next(x for x in conditional_access if x.get("sourceId")=="ACCAMACCAMEELMANAS")
          assert anas.get("priceYear")==2026 and "21 €/nuit" in anas.get("price","") and "16 €/nuit" in anas.get("price","") and anas.get("priceEvidenceDocument","").startswith("https://") and anas.get("accessVerification")=="adhesion_village_requise_aire_autonome_a_verifier", "ANAS 2026 : grille documentée ou réserve d'accès manquante"
          clos=next(x for x in visible_regional if x.get("sourceId")=="ACCAMPDL044V5002ZN")
          mouettes=next(x for x in visible_regional if x.get("sourceId")=="ACCAMACCAMPDL044000155")
          assert clos.get("price")=="Non confirmé" and "4,50" in clos.get("fees2026","") and "15 h" in clos.get("operationalWarning","") and clos.get("feeEvidenceUrl","").startswith("https://"), "Clos Mer et Nature : frais 2026/horaire non sourcés ou tarif de base prétendument confirmé"
          assert mouettes.get("price")=="Non confirmé" and "2024" in mouettes.get("historicPriceEvidence","") and "22 h 30" in mouettes.get("operationalWarning",""), "Les Mouettes : année tarifaire ou restriction nocturne non tracée"
          saint_molf=next(x for x in visible_regional if x.get("sourceId")=="ACCAMEAIREDESTMOLF")
          assert mouettes.get("businessRegistrationSiret2026")=="84393721000014" and mouettes.get("historicBrochureSiret")=="38369180500022" and mouettes.get("businessRegistrationSource")=="https://annuaire-entreprises.data.gouv.fr/etablissement/84393721000014" and mouettes.get("price")=="Non confirmé", "44 : état juridique actuel/ancien SIRET des Mouettes ou réserve tarif manquants"
          assert mouettes.get("receptionHoursSource")=="https://www.les-mouettes-camping.com/conditions-generales-de-vente" and "avant 11 h" in mouettes.get("receptionHoursNote",""), "44 : CGV horaires Les Mouettes non sourcées"
          assert saint_molf.get("animalAcceptancePublished") is True and saint_molf.get("animalAcceptanceSource")=="https://www.cirkwi.com/fr/point-interet/1157462-aire-de-camping-cars-de-saint-molf" and saint_molf.get("overnightStatus")=="not_established" and saint_molf.get("price")=="Non confirmé", "44 : Saint-Molf doit conserver ses réserves nuitée et prix"
          assert abs(float(saint_molf.get("latitude"))-47.3834)<0.000001 and abs(float(saint_molf.get("longitude"))+2.4303)<0.000001 and saint_molf.get("overnightRegulationSource","").startswith("https://www.mairie-saint-molf.fr/"), "44 : GPS/Règlements Saint-Molf manquants"
          gps_operator={"ACCAMACCAMPDL044000155": (47.22038,-2.13734), "ACCAMPDL044V51I23X": (47.241931,-2.267936)}
          for target_id,(lat,lon) in gps_operator.items():
              item=next(x for x in visible_regional if x.get("sourceId")==target_id)
              assert item.get("gpsSourceType")=="exploitant_coordonnees_publiees" and item.get("gpsPreviousRegional") and item.get("gpsEvidenceNote"), f"GPS opérateur non documenté pour {target_id}"
              assert abs(float(item.get("latitude"))-lat)<0.0000001 and abs(float(item.get("longitude"))-lon)<0.0000001, f"GPS opérateur inattendu {target_id}"
              assert item.get("price")=="Non confirmé", f"Prix 2026 indûment modifié pour {target_id}"
          besle=next(x for x in visible_regional if x.get("sourceId")=="ACCAMPDL044V51HCFY")
          besle_picnic=next(x for x in visible_regional if x.get("sourceId")=="ACCAMPDL044V51HCG4")
          assert besle.get("capacityCampingCar2026")==32 and besle.get("capacityTotal2026")==40 and besle.get("contactEmail")=="campingduportdebesle@orange.fr" and "mairie-guemene-penfao.fr" in str(besle.get("capacityEvidenceUrl","")), "Beslé : capacité municipale ou contact manquant"
          assert besle_picnic.get("overnightStatus")=="not_established" and besle_picnic.get("nearbyStaySourceId")==besle.get("sourceId") and besle_picnic.get("priceStatus")=="not_applicable_for_night_stay", "Beslé : confusion camping/pique-nique"
          assert "avril à octobre" in besle.get("seasonalDatesNote","") and "avril à septembre" in besle.get("seasonalDatesNote",""), "Beslé : contradiction saison non explicitée"
          plesse_picnic=next(x for x in visible_regional if x.get("sourceId")=="ACCAMPDL044V51HCG9")
          avessac_picnic=next(x for x in visible_regional if x.get("sourceId")=="ACCAMPDL044V51HCFZ")
          plesse_osm=next(x for x in visible_osm if x.get("sourceId")=="node/11786823109")
          assert abs(float(plesse_picnic.get("latitude"))-47.54056)<0.000001 and abs(float(plesse_picnic.get("longitude"))+1.88645)<0.000001 and plesse_picnic.get("gpsPreviousRegional")=={"latitude":47.55694,"longitude":-1.83597}, "Plessé : correction GPS e-SPRIT ou historique manquants"
          assert plesse_picnic.get("nearbyOsmSourceId")==plesse_osm.get("sourceId") and 50<plesse_picnic.get("nearbyOsmDistanceM",0)<350 and plesse_picnic.get("overnightStatus")=="not_established", "Plessé : OSM voisin sans autorisation nocturne, ne pas fusionner"
          assert avessac_picnic.get("gpsIndependentEvidenceUrl")=="https://www.cirkwi.com/fr/point-interet/3849213-aire-de-pique-nique" and avessac_picnic.get("overnightStatus")=="not_established", "Avessac : coordonnées e-SPRIT / réserve nuitée manquantes"
          picnic_31={x.get("sourceId"):x for x in visible_regional if str(x.get("sourceId")) in {"ACCAMPDL044V51HCGD","ACCAMPDL044V51HCG2","ACCAMPDL044V51HCG7","ACCAMPDL044V51HCG0"}}
          assert len(picnic_31)==4 and all(x.get("overnightStatus")=="not_established" and x.get("priceStatus")=="not_applicable_for_night_stay" for x in picnic_31.values()), "44 lot 31 : 4 pique-niques non établis manquants"
          assert picnic_31["ACCAMPDL044V51HCGD"].get("gpsIndependentEvidenceUrl")=="https://www.cirkwi.com/fr/point-interet/3849227-aire-de-pique-nique", "Saint-Nicolas : GPS e-SPRIT absent"
          assert picnic_31["ACCAMPDL044V51HCG2"].get("sourceOfficial")=="https://rando.loire-atlantique.fr/service/187459-Aire-de-pique-nique", "Fégréac : preuve Le Bellion manquante"
          assert len(picnic_31["ACCAMPDL044V51HCG7"].get("gpsAlternativeSites",[]))==2 and abs(float(picnic_31["ACCAMPDL044V51HCG7"]["latitude"])-47.70237)<0.000001, "Pierric : confusion GPS des trois aires"
          assert picnic_31["ACCAMPDL044V51HCG0"].get("gpsLocationPrecision")=="localisation_a_confirmer" and abs(float(picnic_31["ACCAMPDL044V51HCG0"]["latitude"])-47.6247929)<0.000001, "Conquereuil : GPS douteux déplacé sans preuve"
          guemene_picnic=next(x for x in visible_regional if x.get("sourceId")=="ACCAMPDL044V51HCG4")
          conquereuil_picnic=next(x for x in visible_regional if x.get("sourceId")=="ACCAMPDL044V51HCG0")
          assert guemene_picnic.get("localityEvidenceUrl")=="https://rando.loire-atlantique.fr/service/187461-Aire-de-pique-nique" and 20<=guemene_picnic.get("nearbyPicnicCandidateDistanceM",0)<=90 and guemene_picnic.get("overnightStatus")=="not_established", "Guemene : aire Prairies et point voisin non établis"
          assert abs(float(guemene_picnic.get("latitude"))-47.7012569)<0.0000001 and abs(float(guemene_picnic.get("longitude"))+1.8661508)<0.0000001, "Guemene : déplacement GPS sans preuve"
          assert conquereuil_picnic.get("localityAlternativeEvidenceUrl")=="https://rando.loire-atlantique.fr/service/187457-Aire-de-pique-nique" and conquereuil_picnic.get("gpsLocationPrecision")=="localisation_a_confirmer" and conquereuil_picnic.get("overnightStatus")=="not_established", "Conquereuil : confusion Coisma et Potinieres"
          assert abs(float(conquereuil_picnic.get("latitude"))-47.6247929)<0.0000001 and abs(float(conquereuil_picnic.get("longitude"))+1.750375)<0.0000001, "Conquereuil : GPS de référence modifié sans preuve"
          piardiere=next(x for x in visible_regional if x.get("sourceId")=="ACCAMPDL044V51HCFX")
          assert piardiere.get("contactPhone") and "commune-de-plesse.com" in piardiere.get("sourceOfficial",""), "44 : source communale La Piardière manquante"
          corcoue_parking=next(x for x in visible_osm if x.get("sourceId")=="way/909611149")
          corcoue_services=next(x for x in visible_regional if x.get("sourceId")=="ACCAMPDL044V5006F5")
          assert corcoue_parking.get("sharedSiteWithSourceId")==corcoue_services.get("sourceId") and corcoue_services.get("sharedSiteWithSourceId")==corcoue_parking.get("sourceId"), "Corcoué : liaison bidirectionnelle des zones manquante"
          assert "gratuit" in str(corcoue_parking.get("price","")).lower() and "4" in str(corcoue_parking.get("price","")), "Corcoué : tarif de stationnement 2026 non reporté"
          overnight_other_regional=sum(x.get("overnightStatus")=="not_established" and "pique-nique" not in str(x.get("type","")).lower() for x in visible_regional)
          overnight_extra=sum(x.get("overnightStatus")=="not_established" for x in visible_osm)
          overnight_prohibited_regional=[x for x in visible_regional if x.get("overnightStatus")=="prohibited"]
          overnight_prohibited_extra=[x for x in visible_osm if x.get("overnightStatus")=="prohibited"]
          assert len(overnight_prohibited_regional)==5 and not overnight_prohibited_extra, "44 : 5 interdictions explicites attendues"
          assert all(x.get("overnightReason") and str(x.get("overnightEvidenceUrl","")).startswith("https://") for x in overnight_prohibited_regional), "44 : fiche à nuitée interdite sans source fiable"
          night_unestablished_new={"ACCAMPDL044V50HSVL","ACCAMPDL044V51D0AJ","ACCAMPDL044V51MES6","ACCAMPDL044V51R0KA","ACCAMPDL044V519OUQ","ACCAMPDL044V50ETZU","ACCAMPDL044V50ET43"}
          night_unestablished_records=[x for x in visible_regional if str(x.get("sourceId")) in night_unestablished_new]
          assert len(night_unestablished_records)==7 and all(x.get("overnightStatus")=="not_established" and x.get("overnightClassification")=="not_established_not_prohibited" and str(x.get("overnightEvidenceUrl","")).startswith("https://") for x in night_unestablished_records), "44 lot 33 : qualification prudentielle des 7 points sans preuve de nuitée incomplète"
          assert all(x.get("overnightVerificationNote") for x in night_unestablished_records), "44 lot 33 : justification d’incertitude manquante"
          chenes=next(x for x in visible_regional if x.get("sourceId")=="ACCAMACCAMPDL044V50G1TE")
          assert ranch.get("indicative2026RateYear")==2026 and "74 €" in ranch.get("indicative2026RateLabel","") and ranch.get("indicative2026RateSource")=="https://www.campingfrance.com/uk/find-your-campsite/pays-de-la-loire/loire-atlantique/la-plaine-sur-mer/le-ranch3" and ranch.get("price")=="Non confirmé", "Le Ranch : repère CampingFrance 2026 ne doit pas être confondu avec un tarif exploitant"
          assert "14 h" in chenes.get("receptionHoursNote","") and "12 h" in chenes.get("receptionHoursNote","") and chenes.get("receptionHoursSource")=="https://www.leschenesverts.info/location-emplacements-villeneuve-en-retz/" and chenes.get("price")=="Non confirmé", "Les Chenes Verts : heures opérateur et tarif à confirmer manquants"
          municipal_ids={"HPAELECLEIN","MUNICIPAL44LEPOULIGUENLESMOUETTES2026"}
          municipal_sites=[x for x in visible_regional if x.get("sourceId") in municipal_ids]
          assert len(municipal_sites)==2 and {x.get("capacityTotalNakedPitches") for x in municipal_sites}=={109,200}, "44 : deux campings municipaux du Pouliguen / capacités manquants"
          assert all(x.get("priceYear")==2026 and x.get("priceEvidenceDocument","").endswith("2025_50_SG-Tarifs-campings-aire-de-campings-car.pdf") and "18,95 €" in x.get("price","") and "20,70 €" in x.get("price","") and "27,30 €" in x.get("price","") and x.get("contactEmailSource","").startswith("https://") for x in municipal_sites), "44 : tarif 2026 ou contact municipal manquant"
          aire_pouliguen=next(x for x in visible_regional if x.get("sourceId")=="ACCAMECCLEPOULIGUEN")
          assert "4,40 €" in aire_pouliguen.get("price","") and "4,20 €" not in aire_pouliguen.get("price","") and aire_pouliguen.get("priceSource")==municipal_sites[0]["priceSource"], "44 : tarif 2026 borne du Pouliguen non rectifié"
          assert len(regional)==160 and len(visible_regional)==158 and total_visible==167, "44 : après deux ajouts le compteur attendu est 167"
          night_flags_total=overnight_pending+overnight_other_regional+overnight_extra+len(overnight_prohibited_regional)+len(overnight_prohibited_extra)
          night_filter_visible=total_visible-night_flags_total
          assert night_flags_total==22 and night_filter_visible==145, f"44 : attendu 17 nuitées non établies + 5 interdictions (145 points affichés après filtre), obtenu {night_flags_total} (affichage filtre {night_filter_visible})"
          missing_city=missing_services=unknown_price=bad_gps=0
          candidates=[]
          for x in osm:
              name=x.get("name","")
              if not x.get("city") or "confirmer" in str(x.get("city")).lower(): missing_city+=1
              if not x.get("services"): missing_services+=1
              if not x.get("price") or "confirm" in str(x.get("price")).lower(): unknown_price+=1
              a=coords(x)
              if a is None:
                  bad_gps+=1
                  continue
              near=[]
              for y in regional:
                  b=coords(y)
                  if b is None: continue
                  d=distance(a,b)
                  if d<=350:
                      near.append((round(d),y))
              near.sort(key=lambda t:t[0])
              if near:
                  best=near[0]
                  confidence="nom_identique" if norm(name)==norm(best[1].get("name")) else ("proche_30m" if best[0]<=30 else "a_verifier")
                  candidates.append((name,x.get("sourceId",""),best[1].get("name",""),best[1].get("sourceId",""),best[0],len(near),confidence))
          lines=[
              "# Contrôle automatique des aires — Loire-Atlantique (44)",
              "",
              "Ce rapport est indicatif : la proximité ne prouve pas un doublon. Aucune donnée n'est modifiée.",
              "",
              f"- Fiches OSM : **{len(osm)}**",
              f"- Fiches régionales : **{len(regional)}**",
              f"- Communes à vérifier : **{missing_city}**",
              f"- Services absents des fiches OSM : **{missing_services}**",
              f"- Compléments OSM bruts dont le prix est absent, partiel ou contient 'confirm' : **{unknown_price}** (ne couvre pas les fiches régionales)",
              f"- Fiches régionales brutes dont le prix vaut exactement 'Non confirmé' : **{regional_unknown}**",
              f"- Fiches régionales visibles au prix exactement 'Non confirmé' : **{visible_regional_unknown}**",
              f"- Simples aires de pique-nique au tarif de nuitée non applicable, sans nuitée validée : **{len(excluded_picnic)}**",
              "- La baisse du nombre de prix inconnus provient d'une **requalification**, pas d'une confirmation de tarif.",
              f"- Parmi celles-ci, fiches disposant d'un contact public sourcé (camping, ferme ou mairie) : **{len(unresolved_with_contact)}**",
              f"- Compléments visibles au prix non confirmé avec un contact public sourcé : **{len(unresolved_osm_with_contact)}**",
              f"- **Total fiches visibles au prix strictement Non confirmé avec un contact : {len(unresolved_with_contact)+len(unresolved_osm_with_contact)} / {visible_regional_unknown+visible_osm_unknown}**",
              "- Aucun contact n'a été appelé : un téléphone sourcé ne remplace pas une confirmation de tarif.",
              f"- Fiches complémentaires brutes au prix exactement 'Non confirmé' : **{osm_unknown}**",
              f"- Fiches complémentaires visibles au prix exactement 'Non confirmé' : **{visible_osm_unknown}**",
              f"- **Total des tarifs strictement non confirmés parmi les fiches visibles : {visible_regional_unknown+visible_osm_unknown}**",
              f"- Courriels publics sourcés sur les fiches visibles : **{len(emails)}** (dont 11 sur 11 prix non confirmés)",
              "- Le Ranch : point vidange officiel sur site ; prix et accès sans nuitée non publiés.",
              f"- Fiches régionales masquées par doublon déclaré : **{len(regional)-len(visible_regional)}**",
              f"- Compléments OSM masqués par le filtre transversal : **{len(osm)-len(visible_osm)}**",
              f"- **Total de fiches visibles attendu (mêmes filtres que app.js) : {total_visible}** ({len(visible_regional)} régionales + {len(visible_osm)} complémentaires)",
              f"- Variation depuis 165 fiches avant lot 35 : **{total_visible-165:+d}** ; 167 lieux attendus après ajout de deux campings municipaux distincts",
              f"- Aires de pique-nique régionales avec nuitée non établie : **{overnight_pending}**",
              f"- Autres haltes régionales avec nuitée non établie : **{overnight_other_regional}**",
              f"- Compléments visibles avec nuitée non établie : **{overnight_extra}**",
              f"- Fiches régionales avec nuitée explicitement non autorisée (jour seulement ou services uniquement) : **{len(overnight_prohibited_regional)}**",
              f"- **Filtre nuitée interdite OU non établie : {night_filter_visible} lieux / {total_visible}**",
              "- Lot 33 : 7 fiches auparavant non filtrées requalifiées nuitée NON ÉTABLIE (sans prétendre une interdiction) ; 143 visibles avec filtre.",
              "- Lot 34 : Le Ranch dispose d’un prix de référence tiers 2026 (74 €/nuit, non contractuel) distinct du champ tarif non confirmé ; Chênes Verts horaires d’emplacement 14h/12h sourcés.",
              "- Lot 35 : deux campings municipaux au Pouliguen, Le Cléin et Les Mouettes, 109/200 emplacements nus ; grille communale 2026 18,95/20,70/27,30 €, et borne distincte 4,40 € / 100 L.",
              "- Lot 36 : Les Mouettes de Saint-Père-en-Retz — établissement 2026 administrativement actif, discordance avec SIRET des anciens documents et horaires CGV non millésimés ; Saint-Molf — GPS et animaux e-SPRIT 2026 confirmés, nuitée et prix toujours à vérifier.",
              "- Ce filtre ne prouve pas le droit à la nuitée dans les fiches restantes.",
              f"- Compléments visibles explicitement marqués doublons possibles : **{len(extra_potential_duplicates)}**",
              f"- Fiches visibles explicitement liées à une autre zone du même ensemble : **{len(linked_zones)}**",
              f"- Fiches avec conditions d'accès spécifiques documentées (France Passion / ANAS) : **{len(conditional_access)}**",
              "- ANAS Les Moutiers : prix publiés dans le VAC'ANAS 2026 (16/21 €/nuit, adhérents 12/17 €), accès et capacité actuelle à confirmer.",
              "- Clos Mer et Nature : seuls les frais annexes 2026 sont documentés ; contrat et FAQ divergent sur les heures d'arrivée/départ.",
              "- Les Mouettes (Saint-Père-en-Retz) : grille 2024, prix affichés contradictoires et restriction horaire à clarifier.",
              f"- Campings avec GPS propre publié par l'exploitant et origine régionale conservée : **{len(gps_operator)}** (Les Mouettes, Capfun L'Ève).",
              "- Les coordonnées du camping ne localisent pas précisément la borne ou la place camping-car.",
              "- La mention d'une adhésion ne vaut pas preuve de disponibilité d'une étape en 2026.",
              "- Corcoué Grotte Saint-Jean : 2 repères cartographiques d'un seul site comportant 4 places, à ne pas additionner.",
              "- Beslé : 32 emplacements nus camping-car/tente/caravane sur 40 au total ; pique-nique proche sans droit de nuitée attesté.",
              "- Plessé : GPS de l’aire de pique-nique place de l’Église rectifié depuis e-SPRIT juin 2026, point OSM à proximité non assimilé ; Avessac GPS recoupé indépendamment.",
              "- Lot 31 : GPS confirmé à Saint-Nicolas-de-Redon ; lieu Le Bellion corroboré ; Pierric (3 aires distinctes) et Conquereuil (repère générique) signalés sans déplacement arbitraire.",
              "- Lot 32 : Prairies de la Vilaine recensées officiellement ; source Itinerail ancienne à proximité sans fusion ; Coisma à Conquereuil distinct de la localisation générique non résolue.",
              "- Ces doublons potentiels ne sont pas fusionnés sans concordance suffisante des emprises.",
              f"- Coordonnées GPS invalides : **{bad_gps}**",
              f"- Fiches OSM avec une correspondance régionale à 350 m ou moins : **{len(candidates)}**",
              "",
              "| Fiche OSM | Fiche régionale la plus proche | Distance | Autres fiches dans 350 m | Indice |",
              "|---|---|---:|---:|---|"
          ]
          for name,oid,rname,rid,metres,n,confidence in candidates:
              clean=lambda s:str(s).replace("|","/").replace("\n"," ")
              lines.append(f"| {clean(name)} (`{oid}`) | {clean(rname)} (`{rid}`) | {metres} m | {n-1} | {confidence} |")
          report="\n".join(lines)+"\n"
          print(report)
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary: Path(summary).write_text(report,encoding="utf-8")
          PY
