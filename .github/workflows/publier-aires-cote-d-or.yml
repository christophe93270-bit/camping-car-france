name: Publier les aires de Côte-d'Or
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer le controle et creer le fichier Côte-d'Or
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow controle-cote-d-or.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then echo "Aucun controle valide"; exit 1; fi
          gh run download "$RUN_ID" -n controle-cote-d-or
          python - <<'PY'
          import json,math
          from pathlib import Path
          report=json.loads(Path("controle-cote-d-or.json").read_text(encoding="utf-8"))
          assert report["department"]=="21"
          rows=report["selected"]
          assert len(rows)==18 and report["counts"]["selected"]==18, "La selection a change; publication annulee"
          output=[];seen=set()
          for row in rows:
              key=row["id"]
              assert key not in seen
              seen.add(key)
              assert row["type"]=="caravan_site" and row["name"].strip()
              lat=float(row["latitude"]);lon=float(row["longitude"])
              assert math.isfinite(lat) and math.isfinite(lon) and 46.8<lat<48.2 and 4.0<lon<5.6
              source="https://www.openstreetmap.org/"+key
              output.append({"department":"21","name":row["name"].strip(),"city":row.get("city") or "Commune à confirmer","type":"Aire de camping-car (à vérifier)","services":[],"price":"Non confirmé","status":"Donnée OpenStreetMap non vérifiée : accès, tarifs et services à confirmer","source":source,"latitude":lat,"longitude":lon,"gpsSource":source,"dataLicense":"ODbL","dataAttribution":"© OpenStreetMap contributors","importReview":"À contrôler avant déplacement","sourceId":key})
          Path("aires-cote-d-or.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("18 aires potentielles de Côte-d'Or preparees")
          PY
      - name: Publier les aires
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aires-cote-d-or.json
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Publier 18 aires potentielles de Côte-d'Or"
          git push
