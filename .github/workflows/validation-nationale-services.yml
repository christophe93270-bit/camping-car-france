name: Validation nationale des services OSM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Collecter les propositions nationales
        run: python scripts/proposer-enrichissement-national.py
      - name: Verifier les propositions et preparer les fichiers
        run: python scripts/valider-propositions-nationales.py
      - name: Archiver les propositions et fichiers prepares
        uses: actions/upload-artifact@v4
        with:
          name: validation-nationale-a-controler
          path: |
            rapports-enrichissement/
            validation-nationale/
          retention-days: 30
