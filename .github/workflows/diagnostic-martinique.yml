name: Diagnostic des aires Martinique
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Rechercher les lieux OSM en Martinique
        run: |
          python -m pip install --quiet shapely requests osmium
          python - <<'PY'
          import json,requests
          from shapely.geometry import shape,Point
          session=requests.Session()
          session.headers.update({"User-Agent":"CampingCarFrance-data-study/1.0"})
          geo=session.get("https://etalab-datasets.geo.data.gouv.fr/contours-administratifs/2026/geojson/departements-1000m.geojson",timeout=90)
          geo.raise_for_status()
          features=geo.json().get("features",[])
          dep=next((x for x in features if str(x.get("properties",{}).get("code"))=="972"),None)
          if dep is None:raise RuntimeError("Contour administratif Martinique (972) introuvable")
          area=shape(dep["geometry"])
          url="https://download.geofabrik.de/central-america-latest.osm.pbf"
          # Martinique est disponible dans l'extrait des Antilles de Geofabrik.
          url="https://download.geofabrik.de/central-america/caribbean-latest.osm.pbf"
          dest="martinique-source.osm.pbf"
          with session.get(url,stream=True,timeout=(20,180)) as response:
              response.raise_for_status()
              with open(dest,"wb") as output:
                  for chunk in response.iter_content(chunk_size=1024*1024):
                      if chunk:output.write(chunk)
          print("Downloaded OSM PBF bytes:",__import__("os").stat(dest).st_size,flush=True)
          import osmium
          found={}
          class Handler(osmium.SimpleHandler):
              def accept(self,item,kind):
                  tags=dict(item.tags)
                  t=tags.get("tourism") if tags.get("tourism")=="caravan_site" else tags.get("amenity")
                  if t not in ("caravan_site","sanitary_dump_station"):return
                  try:
                      p=item.location if kind=="node" else item.nodes[0].location
                      lat=float(p.lat);lon=float(p.lon)
                  except (ValueError,IndexError,RuntimeError):return
                  if not area.covers(Point(lon,lat)):return
                  key=kind+"/"+str(item.id)
                  found[key]={"id":key,"name":tags.get("name",""),"city":tags.get("addr:city",""),"postcode":tags.get("addr:postcode",""),"type":t,"latitude":lat,"longitude":lon,"website":tags.get("website",""),"source":"https://www.openstreetmap.org/"+key}
              def node(self,n):self.accept(n,"node")
              def way(self,w):self.accept(w,"way")
          h=Handler()
          h.apply_file(dest,locations=True)
          result={"department":"972","note":"Candidats OSM a verifier individuellement avant publication; les centres des voies peuvent etre approximatifs","attribution":"© OpenStreetMap contributors","license":"ODbL","count":len(found),"complete":True,"records":list(found.values())}
          with open("diagnostic-martinique.json","w",encoding="utf-8") as f:json.dump(result,f,ensure_ascii=False,indent=2)
          print("Candidats Martinique:",len(found),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-martinique
          path: diagnostic-martinique.json
