name: Diagnostic des aires Charente-Maritime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspecter:
    runs-on: ubuntu-latest
    steps:
      - name: Rechercher les aires dans OpenStreetMap
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          query='''[out:json][timeout:90];(nwr["tourism"="caravan_site"](45.05,-1.60,46.42,-0.05);nwr["amenity"="sanitary_dump_station"](45.05,-1.60,46.42,-0.05););out center tags;'''
          data=urllib.parse.urlencode({"data":query}).encode()
          request=urllib.request.Request("https://overpass.kumi.systems/api/interpreter",data=data,headers={"User-Agent":"CampingCarFrance/1.0 (open-data diagnostic)"})
          items=None
          for endpoint in ("https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"):
              try:
                  request=urllib.request.Request(endpoint,data=data,headers={"User-Agent":"CampingCarFrance/1.0"})
                  with urllib.request.urlopen(request,timeout=115) as response:
                      items=json.load(response)["elements"]
                  break
              except Exception as exc:
                  print("Source indisponible:",endpoint,str(exc))
          if items is None:
              items=[]
              print("Aucun serveur accessible, diagnostic vide.")
          records=[]
          for item in items:
              tags=item.get("tags",{})
              lat=item.get("lat",item.get("center",{}).get("lat"))
              lon=item.get("lon",item.get("center",{}).get("lon"))
              records.append({"id":str(item["type"])+"/"+str(item["id"]),"name":tags.get("name",""),"city":tags.get("addr:city",""),"postcode":tags.get("addr:postcode",""),"type":tags.get("tourism") or tags.get("amenity"),"latitude":lat,"longitude":lon,"website":tags.get("website",""),"source":"https://www.openstreetmap.org/"+str(item["type"])+"/"+str(item["id"])})
          with open("diagnostic-charente-maritime.json","w",encoding="utf-8") as f:json.dump({"note":"Candidats géographiques non validés: la zone déborde le département. Vérifier les communes et éviter les doublons avant toute publication.","attribution":"© OpenStreetMap contributors","license":"ODbL","count":len(records),"records":records},f,ensure_ascii=False,indent=2)
          print("Candidats géographiques:",len(records))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-charente-maritime
          path: diagnostic-charente-maritime.json
