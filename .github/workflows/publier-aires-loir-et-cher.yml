name: Publier les aires de Loir-et-Cher
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer le controle et creer le fichier Loir-et-Cher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow controle-loir-et-cher.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then echo "Aucun controle valide"; exit 1; fi
          gh run download "$RUN_ID" -n controle-loir-et-cher
          python - <<'PY'
          import json,math
          from pathlib import Path
          report=json.loads(Path("controle-loir-et-cher.json").read_text(encoding="utf-8"))
          assert report["department"]=="41"
          rows=report["selected"]
          assert len(rows)==24 and report["counts"]["selected"]==24, "La selection a change; publication annulee"
          output=[];seen=set()
          for row in rows:
              key=row["id"]
              assert key not in seen
              seen.add(key)
              assert row["type"]=="caravan_site" and row["name"].strip()
              lat=float(row["latitude"]);lon=float(row["longitude"])
              assert math.isfinite(lat) and math.isfinite(lon) and 47.1<lat<48.2 and 0.5<lon<2.4
              source="https://www.openstreetmap.org/"+key
              output.append({"department":"41","name":row["name"].strip(),"city":row.get("city") or "Commune à confirmer","type":"Aire de camping-car (à vérifier)","services":[],"price":"Non confirmé","status":"Donnée OpenStreetMap non vérifiée : accès, tarifs et services à confirmer","source":source,"latitude":lat,"longitude":lon,"gpsSource":source,"dataLicense":"ODbL","dataAttribution":"© OpenStreetMap contributors","importReview":"À contrôler avant déplacement","sourceId":key})
          # L'import OSM initial ne doit jamais ecraser les fiches verifiees et enrichies.
          target = Path("aires-loir-et-cher.json")
          if target.exists():
              current = json.loads(target.read_text(encoding="utf-8"))
              if isinstance(current,list) and len(current)>0:
                  print(f"PROTECTION : {len(current)} fiches deja publiees ; aucune reecriture depuis l'import OSM initial de {len(output)} lieux.")
                  raise SystemExit(0)
          target.write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("24 aires potentielles de Loir-et-Cher preparees")
          PY
      - name: Publier les aires
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aires-loir-et-cher.json
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Publier 24 aires potentielles de Loir-et-Cher"
          git push
