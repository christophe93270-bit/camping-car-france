name: Valider les aires Haute-Marne
on:
  workflow_dispatch:
  push:
    paths:
      - 'aires-haute-marne.json'
      - '.github/workflows/valider-aires-haute-marne.yml'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controler les 13 fiches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('aires-haute-marne.json').read_text(encoding='utf-8'))
          assert isinstance(a,list) and len(a)==16, 'Nombre de fiches inattendu'
          seen=set()
          for i,x in enumerate(a,1):
              assert x.get('department')=='52', f'Departement fiche {i}'
              assert x.get('name') and x.get('city') and x['city']!='Commune à confirmer', f'Commune fiche {i}'
              assert isinstance(x.get('latitude'),(int,float)) and 47.5<x['latitude']<49, f'Latitude fiche {i}'
              assert isinstance(x.get('longitude'),(int,float)) and 4<x['longitude']<6, f'Longitude fiche {i}'
              assert isinstance(x.get('services'),list), f'Services fiche {i}'
              sid=x.get('sourceId')
              if sid:
                  assert sid not in seen, f'Identifiant dupliqué fiche {i}'
                  seen.add(sid)
                  assert x.get('source')==f'https://www.openstreetmap.org/{sid}', f'Source OSM fiche {i}'
              else:
                  assert x.get('source')==x.get('sourceOfficial') and x.get('gpsSource')==x.get('sourceOfficial'), f'Source officielle/GPS fiche {i}'
              assert x.get('sourceOfficial','').startswith('https://'), f'Source officielle fiche {i}'
          print('OK : 16 fiches Haute-Marne valides')
          PY
