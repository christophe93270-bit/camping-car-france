name: Publier les aires de Vendée
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire et contrôler les aires de Vendée
        env:
          SOURCE_URL: https://wcf.tourinsoft.com/Syndication/3.0/cdt85/ce2f1f33-fbe9-44fe-9365-9e83938525ae/Objects
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          url=os.environ["SOURCE_URL"]
          req=urllib.request.Request(url,headers={"User-Agent":"CampingCarFrance/1.0","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=90) as response:
              payload=json.load(response)
          records=payload if isinstance(payload,list) else next((v for v in payload.values() if isinstance(v,list)),[])
          result=[]; seen=set(); rejected=0
          for item in records:
              if str(item.get("ObjectTypeName","")).strip().casefold()!="aire de camping car":
                  continue
              name=str(item.get("NomOffre") or item.get("SyndicObjectName") or "").strip()
              city=str(item.get("Commune") or "").strip()
              identifier=str(item.get("SyndicObjectID") or "").strip()
              try:
                  lat=float(str(item.get("GmapLatitude","")).replace(",","."))
                  lon=float(str(item.get("GmapLongitude","")).replace(",","."))
              except (ValueError,TypeError):
                  rejected+=1;continue
              if not name or not city or not identifier or not (46.1<=lat<=47.3 and -2.6<=lon<=-0.4):
                  rejected+=1;continue
              key=identifier.casefold()
              if key in seen:
                  rejected+=1;continue
              seen.add(key)
              kind=str(item.get("Type") or "Aire de camping-car").strip()
              result.append({
                  "department":"85","name":name,"city":city,
                  "type":kind,"services":[],
                  "price":"Non confirmé",
                  "status":"Donnée ouverte : tarifs, services, accès et position à confirmer",
                  "source":url,"latitude":lat,"longitude":lon,
                  "gpsSource":url,"dataLicense":"Licence Ouverte 2.0",
                  "dataAttribution":"Vendée Expansion / Tourinsoft",
                  "importReview":"À contrôler avant déplacement",
                  "sourceId":identifier
              })
          if not 15<=len(result)<=50:
              raise SystemExit(f"Volume inattendu: {len(result)} fiches; {rejected} rejetées. Aucune publication.")
          with open("aires-vendee.json","w",encoding="utf-8") as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
              f.write("\n")
          print(f"Fiches Vendée préparées: {len(result)}; rejetées: {rejected}")
          PY
      - name: Publier le fichier Vendée
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aires-vendee.json
          if git diff --cached --quiet; then
            echo "Aucune modification"
          else
            git commit -m "Publier les aires ouvertes de Vendée"
            git push
          fi
