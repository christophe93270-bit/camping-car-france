name: Audit communes et tarifs OSM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Produire les propositions sans modifier les donnees
        run: python scripts/proposer-communes-tarifs-osm.py
      - name: Archiver le rapport CSV
        uses: actions/upload-artifact@v4
        with:
          name: propositions-communes-tarifs-osm
          path: rapports-enrichissement/propositions-communes-tarifs-osm.csv
          retention-days: 30
